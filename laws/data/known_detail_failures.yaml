# Known upstream law detail failures, keyed by 법령MST.
#
# Entries here are not cached as detail XML. They let the cache refresh proceed
# only for MSTs whose upstream lawService.do response is independently verified
# to be intractable. Remove entries when upstream responses are fixed.
#
# Schema per entry (all required):
#   mst: str              — 법령MST as string
#   law_name: str         — human-readable 법령명
#   reason: str           — free-form classification
#   expected_error: str   — substring that must appear in the fetch exception
#   expires_on: str       — "YYYY-MM-DD" ISO date
#
# Loader: laws/detail_failure_allowlist.py

entries:
  # Verified 2026-06-24. XML endpoint returns HTTP 500. HTML endpoint redirects
  # to LSW/lsInfoP.do?lsiSeq=37612, whose title identifies 지방세법시행령.
  - mst: "37612"
    law_name: "지방세법시행령"
    reason: "upstream_http_500"
    expected_error: "500 Server Error"
    expires_on: "2026-10-31"
